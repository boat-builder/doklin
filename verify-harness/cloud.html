<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cloud verification harness</title>
    <style>
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <script>
      // Tauri IPC stub broad enough to boot the REAL <App/> with a /docs
      // workspace (the split harness's in-memory file system), plus a
      // scripted fake of the cloud engine: every cloud_* command answers
      // from window.__cloud, records itself in __cloud.calls, and moves the
      // status array the way the engine would — then emits `cloud-status`
      // through the same listener registry the app's `listen()` calls land
      // in, so a drive can also inject the other events by hand
      // (window.__emit). Nothing here reaches a network.
      const para = (seed, n) =>
        Array.from(
          { length: n },
          (_, i) => `Paragraph ${i + 1} of ${seed}. The quick brown fox jumps over the lazy dog.`,
        ).join("\n\n");

      window.__fs = new Map([
        ["/docs/notes.md", `# Notes\n\n${para("notes", 6)}\n`],
        ["/docs/other.md", `# Other\n\n${para("other", 6)}\n`],
        ["/docs/third.md", `# Third\n\n${para("third", 6)}\n`],
        ["/docs/Projects/plan.md", `# Plan\n\n${para("plan", 3)}\n`],
        ["/drafts/d-1.md", "a draft with a history of its own\n"],
      ]);
      // One draft, so the drafts panel's row menu — the third way into the
      // version rail — has something to open.
      window.__drafts = [{ id: "d-1", path: "/drafts/d-1.md", preview: "a draft" }];
      // The folders the workspace holds (publishing a folder is a folder page).
      window.__dirs = new Set(["/docs", "/docs/Projects"]);
      window.__mtime = 1000;
      window.__writes = [];
      const snap = (c) => ({ mtime_ms: ++window.__mtime, size: c.length });
      const basename = (p) => p.split("/").pop() || p;
      // The tree's file names: the drive adds to this to simulate sync
      // writing a file, then emits `cloud-applied`. One folder, Projects,
      // holds plan.md.
      window.__treeFiles = ["notes.md", "other.md", "third.md"];
      window.__treeCalls = 0;
      const projectsNode = (root) => ({
        kind: "dir",
        name: "Projects",
        path: `${root}/Projects`,
        children: [{ kind: "file", name: "plan.md", path: `${root}/Projects/plan.md` }],
      });
      const treeFor = (path) => {
        if (path.endsWith("/Projects")) return projectsNode(path.slice(0, -"/Projects".length));
        return {
          kind: "dir",
          name: basename(path),
          path,
          children: [
            projectsNode(path),
            ...window.__treeFiles.map((f) => ({ kind: "file", name: f, path: `${path}/${f}` })),
          ],
        };
      };
      const SLUG_ALPHABET = "abcdefghijkmnpqrstuvwxyz23456789";
      const randomSlug = () =>
        Array.from({ length: 8 }, () => SLUG_ALPHABET[Math.floor(Math.random() * SLUG_ALPHABET.length)]).join("");
      const sortPages = (pages) =>
        [...pages].sort(
          (a, b) => (a.kind === "dir" ? 0 : 1) - (b.kind === "dir" ? 0 : 1) || a.path.localeCompare(b.path),
        );

      // The fake engine.
      window.__cloud = {
        statuses: [],
        // What cloud_probe answers: a CloudProbe, or a string to reject with.
        probe: null,
        // What cloud_marker answers for any root.
        marker: null,
        // What the folder picker answers.
        pickedDir: "/Users/me/Downloads",
        token: "ab".repeat(32),
        // What a deployed worker reports; the drive sets it to the version
        // the app was built against (parsed from cloud-worker/src/version.ts).
        workerVersion: 1,
        // What the status's `versions` field carries: the version store's
        // mirror, or null for a worker too old to hold one.
        versionsMirror: null,
        wipeResult: 42,
        calls: [],
      };
      // The version store, scripted the same way (docs/versioning-plan.md
      // §5.5): versions_* answers from window.__versions, records itself in
      // its `calls`, and a restore actually writes the file and emits
      // `versions-applied`, so the app's reload path is exercised too.
      const HOUR = 3600000;
      const DAY = 86400000;
      const startOfToday = (() => {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      })();
      // Anchored to the start of a day, so which group a version falls in
      // never depends on what time the suite runs.
      const at = (daysAgo, hour) => startOfToday - daysAgo * DAY + hour * HOUR;
      const H = (c) => c.repeat(64);
      const snapshot = (ts, extra = {}) => ({
        ts,
        reason: "closing",
        files: 4,
        bytes: 400,
        pinned: false,
        label: null,
        restoredFrom: null,
        delta: null,
        ...extra,
      });
      const version = (ts, hash, extra = {}) => ({
        ts,
        hash,
        size: 120,
        by: "Test Mac",
        reason: "closing",
        label: null,
        pinned: false,
        restoredFrom: null,
        path: "other.md",
        source: "local",
        current: false,
        ...extra,
      });

      window.__versions = {
        // path → FileHistory. The drive replaces this wholesale to script a
        // mirrored version or an empty history.
        histories: {
          "/drafts/d-1.md": {
            root: "/drafts",
            currentHash: H("e"),
            versions: [version(at(0, 10), H("e"), { path: "d-1.md", current: true })],
          },
          "/docs/other.md": {
            root: "/docs",
            currentHash: H("a"),
            versions: [
              version(at(0, 11), H("a"), { current: true }),
              version(at(0, 9), H("b"), { reason: "interval" }),
              version(at(1, 16), H("c"), { reason: "manual", pinned: true, label: "Before the rewrite" }),
              version(at(5, 10), H("d"), { reason: "seed" }),
            ],
          },
        },
        blobs: {
          [H("a")]: "# Other\n\nthe current text\n",
          [H("b")]: "# Other\n\nthis morning's text\n",
          [H("c")]: "# Other\n\nthe named version\n",
          [H("d")]: "# Other\n\nthe first text\n",
          [H("e")]: "a draft with a history of its own\n",
        },
        diff: "--- original\n+++ modified\n@@ -1,3 +1,3 @@\n # Other\n \n-the first text\n+the current text\n",
        // The workspace timeline (§7.2): the retained moments, each with what
        // it changed against the one before it, and — per moment — what
        // restoring it would do to the folder as it stands.
        snapshots: [
          snapshot(at(0, 11), { reason: "closing", delta: { added: 1, removed: 0, changed: 2 } }),
          snapshot(at(0, 9), { reason: "interval", delta: { added: 0, removed: 1, changed: 1 } }),
          snapshot(at(1, 16), {
            reason: "manual",
            pinned: true,
            label: "Before the rewrite",
            delta: { added: 2, removed: 0, changed: 1 },
          }),
          snapshot(at(5, 10), { reason: "seed" }),
        ],
        // ts → SnapshotDiff.
        diffs: {
          [at(1, 16)]: {
            changed: [{ path: "other.md", thenHash: H("c"), nowHash: H("a") }],
            added: ["third.md"],
            missing: ["Projects/plan.md"],
          },
        },
        // What versions_deleted answers; the drive fills it in to make the
        // sidebar's row appear.
        deleted: [],
        // The settings surface (§8): every store's status, every store on
        // this Mac, and what the horizon and export commands were asked.
        statuses: [
          {
            root: "/docs",
            key: "r-docs",
            phase: "idle",
            error: null,
            snapshots: 4,
            oldestMs: at(5, 10),
            newestMs: at(0, 11),
            lastCaptureMs: at(0, 11),
            bytes: { blobs: 2_000_000, snapshots: 48_000 },
            horizonDays: 90,
          },
        ],
        stores: [
          { key: "r-docs", root: "/docs", exists: true, bytes: 2_100_000, snapshots: 4, newestMs: at(0, 11) },
          { key: "r-old", root: "/Users/me/Gone", exists: false, bytes: 640_000, snapshots: 9, newestMs: at(40, 9) },
        ],
        // What the export answers, and how many progress ticks it sends.
        exported: { bytes: 3_400_000, files: 12 },
        forgotten: [],
        // Every workspace restore, as it was asked for.
        restores: [],
        calls: [],
        seq: 0,
      };
      const versionsFor = (path) =>
        window.__versions.histories[path] ?? { root: "/docs", currentHash: null, versions: [] };

      const record = (cmd, args) => window.__cloud.calls.push({ cmd, args });
      const recordVersion = (cmd, args) => window.__versions.calls.push({ cmd, args });
      const hostOf = (endpoint) => endpoint.replace(/^https?:\/\//, "").replace(/\/.*$/, "");
      const statusFor = (root, endpoint, name, wsId) => ({
        root,
        domain: hostOf(endpoint),
        endpoint,
        wsId,
        name,
        phase: "idle",
        lastSyncMs: Date.now(),
        error: null,
        pendingDeletes: 0,
        workerVersion: window.__cloud.workerVersion,
        versions: window.__cloud.versionsMirror,
        public: [],
        presence: [],
      });

      // The listener registry the app's listen() lands in (see the
      // plugin:event|listen case) and the emitter a drive uses.
      window.__listeners = new Map(); // event → [{ id, handler }]
      let nextListenerId = 1;
      window.__emit = (event, payload) => {
        for (const { id, handler } of window.__listeners.get(event) ?? []) {
          handler({ event, id, payload });
        }
      };
      window.__setStatuses = (statuses) => {
        window.__cloud.statuses = statuses;
        window.__emit("cloud-status", statuses);
      };
      const patchStatus = (root, patch) =>
        window.__setStatuses(
          window.__cloud.statuses.map((s) => (s.root === root ? { ...s, ...patch } : s)),
        );
      const delay = (ms) => new Promise((r) => setTimeout(r, ms));
      const progress = async (root, kind, total) => {
        for (let done = 1; done <= total; done += 1) {
          await delay(120);
          window.__emit("cloud-progress", { root, kind, done, total });
        }
      };

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main", windowLabel: "main" },
        },
        transformCallback: (cb) => cb,
        invoke: (cmd, args) => {
          if (cmd.startsWith("cloud_")) record(cmd, args);
          if (cmd.startsWith("versions_")) recordVersion(cmd, args);
          switch (cmd) {
            case "take_window_init":
              return Promise.resolve({
                isMain: true,
                folder: null,
                file: null,
                files: [],
                activeFile: null,
                restored: false,
              });
            case "take_pending_folder":
            case "migrate_scratch":
              return Promise.resolve(null);
            case "read_file": {
              const c = window.__fs.get(args.path);
              return c === undefined
                ? Promise.reject(`no such file: ${args.path}`)
                : Promise.resolve({ contents: c, snapshot: snap(c) });
            }
            case "write_file": {
              window.__fs.set(args.path, args.contents);
              window.__writes.push(args.path);
              return Promise.resolve(snap(args.contents));
            }
            case "path_exists":
              return Promise.resolve(
                window.__dirs.has(args.path) || args.path.startsWith("/Users/me/Downloads") || window.__fs.has(args.path),
              );
            case "list_md_tree": {
              window.__treeCalls += 1;
              return Promise.resolve(treeFor(args.path));
            }
            case "stat_file": {
              const c = window.__fs.get(args.path);
              return c === undefined ? Promise.reject("missing") : Promise.resolve(snap(c));
            }
            case "watch_file": {
              const c = window.__fs.get(args.path) ?? "";
              return Promise.resolve(snap(c));
            }
            case "unwatch_file":
              return Promise.resolve(null);
            case "device_name":
              return Promise.resolve("Test Mac");
            case "list_drafts":
              return Promise.resolve(window.__drafts ?? []);
            case "open_external":
              (window.__opened ??= []).push(args.url);
              return Promise.resolve(null);
            case "plugin:updater|check":
              return Promise.reject("updater unavailable in harness");
            case "plugin:dialog|open":
              return Promise.resolve(window.__cloud.pickedDir);
            case "plugin:event|listen": {
              const id = nextListenerId++;
              const list = window.__listeners.get(args.event) ?? [];
              list.push({ id, handler: args.handler });
              window.__listeners.set(args.event, list);
              return Promise.resolve(id);
            }
            case "plugin:event|unlisten": {
              const list = (window.__listeners.get(args.event) ?? []).filter((l) => l.id !== args.eventId);
              window.__listeners.set(args.event, list);
              return Promise.resolve(null);
            }

            /* ----- the fake engine ----- */
            case "cloud_status":
              return Promise.resolve(window.__cloud.statuses);
            case "cloud_mint_token":
              return Promise.resolve(window.__cloud.token);
            case "cloud_probe":
              return typeof window.__cloud.probe === "string"
                ? Promise.reject(window.__cloud.probe)
                : Promise.resolve(window.__cloud.probe);
            case "cloud_marker":
              return Promise.resolve(window.__cloud.marker);
            case "cloud_connect":
              return (async () => {
                await progress(args.root, "upload", 3);
                window.__setStatuses([
                  ...window.__cloud.statuses,
                  statusFor(args.root, args.endpoint, args.name, "w-new"),
                ]);
                return "w-new";
              })();
            case "cloud_join":
              return (async () => {
                const ws = window.__cloud.probe?.workspace;
                const dest = `${args.destParent}/${ws?.name ?? "Notes"}`;
                await progress(dest, "download", 3);
                window.__setStatuses([
                  ...window.__cloud.statuses,
                  statusFor(dest, args.endpoint, ws?.name ?? "Notes", ws?.id ?? "w-1"),
                ]);
                return dest;
              })();
            case "cloud_resume": {
              const ws = window.__cloud.probe?.workspace;
              window.__setStatuses([
                ...window.__cloud.statuses,
                statusFor(args.root, args.endpoint, ws?.name ?? "Notes", ws?.id ?? "w-1"),
              ]);
              return Promise.resolve(ws?.id ?? "w-1");
            }
            case "cloud_disconnect":
              window.__setStatuses(window.__cloud.statuses.filter((s) => s.root !== args.root));
              return Promise.resolve(null);
            case "cloud_sync_now":
              return Promise.resolve(null);
            case "cloud_pause":
              patchStatus(args.root, { phase: args.paused ? "paused" : "idle" });
              return Promise.resolve(null);
            case "cloud_confirm_deletes":
              patchStatus(args.root, { phase: "idle", pendingDeletes: 0 });
              return Promise.resolve(null);
            case "cloud_check_worker":
              patchStatus(args.root, { phase: "idle", workerVersion: window.__cloud.workerVersion, error: null });
              return Promise.resolve(null);
            case "cloud_token": {
              const s = window.__cloud.statuses.find((s) => s.root === args.root);
              return Promise.resolve({ endpoint: s?.endpoint ?? "", token: window.__cloud.token });
            }
            case "cloud_wipe":
              window.__setStatuses(window.__cloud.statuses.filter((s) => s.root !== args.root));
              return Promise.resolve(window.__cloud.wipeResult);
            case "cloud_set_activity":
              return Promise.resolve(null);

            /* ----- the version store ----- */
            case "versions_status":
              return Promise.resolve(window.__versions.statuses.map((s) => ({ ...s })));
            case "versions_stores":
              return Promise.resolve(window.__versions.stores.map((s) => ({ ...s })));
            case "versions_set_horizon": {
              recordVersion(cmd, args);
              // The real command writes the index and sweeps; the status
              // event is how the surface learns, so the stub emits one too.
              window.__versions.statuses = window.__versions.statuses.map((s) =>
                s.root === args.root ? { ...s, horizonDays: args.days } : s,
              );
              window.__emit("versions-status", window.__versions.statuses.map((s) => ({ ...s })));
              return Promise.resolve(null);
            }
            case "versions_set_cloud_horizon": {
              recordVersion(cmd, args);
              window.__setStatuses(
                window.__cloud.statuses.map((s) =>
                  s.root === args.root && s.versions
                    ? { ...s, versions: { ...s.versions, horizonDays: args.days } }
                    : s,
                ),
              );
              return Promise.resolve(null);
            }
            case "versions_forget": {
              recordVersion(cmd, args);
              window.__versions.forgotten.push(args.key);
              window.__versions.stores = window.__versions.stores.filter((s) => s.key !== args.key);
              return Promise.resolve(null);
            }
            case "versions_export": {
              recordVersion(cmd, args);
              const { files } = window.__versions.exported;
              for (let done = 0; done <= files; done += 1) {
                window.__emit("versions-progress", { root: args.root, done, total: files });
              }
              return Promise.resolve({ ...window.__versions.exported });
            }
            case "versions_snapshots":
              return Promise.resolve(window.__versions.snapshots.map((s) => ({ ...s })));
            case "versions_snapshot_diff":
              return Promise.resolve(
                window.__versions.diffs[args.ts] ?? { changed: [], added: [], missing: [] },
              );
            case "versions_deleted":
              return Promise.resolve(window.__versions.deleted.map((f) => ({ ...f })));
            case "versions_restore_snapshot": {
              // The same three lists the modal showed, narrowed to what was
              // ticked: writes land in the fake filesystem, trashings leave
              // it, and `versions-applied` names everything that moved.
              const diff = window.__versions.diffs[args.ts] ?? { changed: [], added: [], missing: [] };
              const wanted = (rel) => args.paths == null || args.paths.includes(rel);
              const written = [...diff.changed.map((c) => c.path), ...diff.missing].filter(wanted);
              const trashed = diff.added.filter(wanted);
              for (const rel of written) {
                const abs = `${args.root}/${rel}`;
                const then = diff.changed.find((c) => c.path === rel)?.thenHash;
                window.__fs.set(abs, window.__versions.blobs[then] ?? `restored ${rel}\n`);
                window.__writes.push(abs);
              }
              for (const rel of trashed) window.__fs.delete(`${args.root}/${rel}`);
              window.__versions.restores.push({ ts: args.ts, paths: args.paths ?? null, written, trashed });
              window.__emit("versions-applied", {
                root: args.root,
                paths: [...written, ...trashed].map((rel) => `${args.root}/${rel}`),
              });
              return Promise.resolve({
                written: written.length,
                trashed: trashed.length,
                preRestoreTs: Date.now(),
              });
            }
            case "versions_history": {
              // A fresh object every time, the way real IPC hands one over —
              // the app re-renders on identity, and the fake mutates in place.
              const h = versionsFor(args.path);
              return Promise.resolve({ ...h, versions: h.versions.map((v) => ({ ...v })) });
            }
            case "versions_read":
              return Promise.resolve(window.__versions.blobs[args.hash] ?? "");
            case "versions_diff":
              return Promise.resolve(window.__versions.diff);
            case "versions_set_pinned":
            case "versions_set_enabled":
              return Promise.resolve(null);
            case "versions_capture_now": {
              // A snapshot is the whole folder, so every document in it gains
              // a row at that moment — and a PINNED one is never collapsed
              // away, which is what makes naming a moment mean anything.
              const ts = Date.now();
              for (const history of Object.values(window.__versions.histories)) {
                if (history.root !== args.root) continue;
                history.versions = [
                  version(ts, history.currentHash ?? H("a"), {
                    reason: "manual",
                    pinned: true,
                    label: args.label ?? null,
                    current: true,
                  }),
                  ...history.versions.map((v) => ({ ...v, current: false })),
                ];
              }
              return Promise.resolve(snapshot(ts, { reason: "manual", pinned: true, label: args.label ?? null }));
            }
            case "versions_restore_file": {
              const history = versionsFor(args.path);
              const text = args.text ?? window.__versions.blobs[args.hash] ?? "";
              const preRestoreHash = history.currentHash;
              const preRestoreTs = Date.now();
              window.__fs.set(args.path, text);
              window.__writes.push(args.path);
              // The store keeps what it left AND what it made; nothing is
              // removed (docs/versioning-plan.md §12.3.8).
              const hash = args.hash ?? `text-${++window.__versions.seq}`;
              window.__versions.blobs[hash] = text;
              history.currentHash = hash;
              history.versions = [
                version(preRestoreTs + 1, hash, {
                  reason: "restore",
                  restoredFrom: args.ts ?? null,
                  current: true,
                }),
                version(preRestoreTs, preRestoreHash, { reason: "pre-restore" }),
                ...history.versions.map((v) => ({ ...v, current: false })),
              ];
              window.__emit("versions-applied", { root: history.root, paths: [args.path] });
              return Promise.resolve({ preRestoreTs, preRestoreHash, ts: preRestoreTs + 1 });
            }

            /* ----- the public map, as the engine would keep it ----- */
            case "cloud_publish": {
              const s = window.__cloud.statuses.find(
                (st) => args.path === st.root || args.path.startsWith(`${st.root}/`),
              );
              if (!s) return Promise.reject("that path isn't in a connected workspace");
              const rel = args.path === s.root ? "" : args.path.slice(s.root.length + 1);
              const kind = window.__dirs.has(args.path) ? "dir" : "file";
              const existing = s.public.find((p) => p.kind === kind && p.path === rel) ?? null;
              const slug = args.slug ? args.slug.trim().toLowerCase() : (existing?.slug ?? randomSlug());
              if (args.slug && !/^[a-z0-9][a-z0-9-]{2,63}$/.test(slug)) {
                return Promise.reject(
                  "a slug is 3 to 64 characters: lowercase letters, digits and dashes, starting with a letter or digit",
                );
              }
              const taken = s.public.find((p) => p.slug === slug && p !== existing);
              if (taken) return Promise.reject(`"${slug}" is already the address of ${taken.path || "the workspace"}`);
              const entry = {
                slug,
                kind,
                path: rel,
                title: args.title ?? null,
                desc: args.desc ?? null,
                by: "Test Mac",
                at: Date.now(),
                alive: true,
                root: existing?.root ?? false,
              };
              patchStatus(s.root, { public: sortPages([...s.public.filter((p) => p !== existing), entry]) });
              return Promise.resolve(slug);
            }
            case "cloud_unpublish": {
              const s = window.__cloud.statuses.find((st) => st.root === args.root);
              if (!s || !s.public.some((p) => p.slug === args.slug)) return Promise.reject("that page isn't published");
              patchStatus(s.root, { public: s.public.filter((p) => p.slug !== args.slug) });
              return Promise.resolve(null);
            }
            case "cloud_set_root": {
              const s = window.__cloud.statuses.find((st) => st.root === args.root);
              if (!s) return Promise.reject("that workspace isn't connected");
              patchStatus(s.root, { public: s.public.map((p) => ({ ...p, root: args.slug != null && p.slug === args.slug })) });
              return Promise.resolve(null);
            }
            default:
              return Promise.resolve(null);
          }
        },
      };

      // The API's unlisten path dereferences this global.
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: (event, id) => {
          const list = (window.__listeners.get(event) ?? []).filter((l) => l.id !== id);
          window.__listeners.set(event, list);
        },
      };

      // A restorable /docs workspace session so the sidebar renders.
      localStorage.clear();
      localStorage.setItem(
        "doklin:session",
        JSON.stringify({
          version: 2,
          lastRoot: "/docs",
          sessions: {
            "/docs": {
              tabs: [{ id: "t-notes", kind: "file", path: "/docs/notes.md" }],
              activeId: "t-notes",
            },
          },
        }),
      );
    </script>
    <div id="root"></div>
    <script type="module" src="./cloud.tsx"></script>
  </body>
</html>
