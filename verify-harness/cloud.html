<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cloud verification harness</title>
    <style>
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <script>
      // Tauri IPC stub broad enough to boot the REAL <App/> with a /docs
      // workspace (the split harness's in-memory file system), plus a
      // scripted fake of the cloud engine: every cloud_* command answers
      // from window.__cloud, records itself in __cloud.calls, and moves the
      // status array the way the engine would — then emits `cloud-status`
      // through the same listener registry the app's `listen()` calls land
      // in, so a drive can also inject the other events by hand
      // (window.__emit). Nothing here reaches a network.
      const para = (seed, n) =>
        Array.from(
          { length: n },
          (_, i) => `Paragraph ${i + 1} of ${seed}. The quick brown fox jumps over the lazy dog.`,
        ).join("\n\n");

      const params = new URLSearchParams(location.search);
      // The folders in the Library layout (the engine's move,
      // engine/src/cloud/layout.rs): their shared files are in `Library/`,
      // beside `My files/` and `Shared with me/`. /docs starts there in a
      // workspace that is in sections (`?sections`), and moves on a connect
      // or a resume; a joined folder is in it from the start. Anything else
      // at the top of a moved folder is in no section: `__strays` (file
      // names) and `__strayDirs` (folder name → file names).
      window.__moved = new Set(params.has("sections") ? ["/docs"] : []);
      window.__strays = [];
      window.__strayDirs = {};
      // Where a root's shared files are.
      const sharedOf = (root) => (window.__moved.has(root) ? `${root}/Library` : root);
      window.__sharedOf = sharedOf;
      const S = sharedOf("/docs");
      window.__fs = new Map([
        [`${S}/notes.md`, `# Notes\n\n${para("notes", 6)}\n`],
        [`${S}/other.md`, `# Other\n\n${para("other", 6)}\n`],
        [`${S}/third.md`, `# Third\n\n${para("third", 6)}\n`],
        [`${S}/Projects/plan.md`, `# Plan\n\n${para("plan", 3)}\n`],
      ]);
      // The folders the workspace holds (publishing a folder is a folder page).
      window.__dirs = new Set(["/docs", S, `${S}/Projects`]);
      // The engine's move, as the stub keeps it: every path at the top of
      // `root` that is not a section's or hidden goes into `Library/`.
      const intoLibrary = (root, p) => {
        if (!p.startsWith(`${root}/`)) return p;
        const top = p.slice(root.length + 1).split("/")[0];
        return top.startsWith(".") || ["library", "my files", "shared with me"].includes(top.toLowerCase())
          ? p
          : `${root}/Library/${p.slice(root.length + 1)}`;
      };
      window.__moveIntoLibrary = (root) => {
        if (window.__moved.has(root)) return;
        window.__fs = new Map([...window.__fs].map(([p, c]) => [intoLibrary(root, p), c]));
        window.__dirs = new Set([...window.__dirs].map((d) => intoLibrary(root, d)));
        window.__dirs.add(`${root}/Library`);
        window.__moved.add(root);
      };
      window.__mtime = 1000;
      window.__writes = [];
      const snap = (c) => ({ mtime_ms: ++window.__mtime, size: c.length });
      const basename = (p) => p.split("/").pop() || p;
      // The tree's file names: the drive adds to this to simulate sync
      // writing a file, then emits `cloud-applied`. One folder, Projects,
      // holds plan.md.
      window.__treeFiles = ["notes.md", "other.md", "third.md"];
      // Files Doklin neither opens nor syncs: listed (greyed) only when the
      // sidebar shows every file.
      window.__otherFiles = ["photo.png"];
      window.__treeCalls = 0;
      const projectsNode = (root) => ({
        kind: "dir",
        name: "Projects",
        path: `${root}/Projects`,
        children: [{ kind: "file", name: "plan.md", path: `${root}/Projects/plan.md` }],
      });
      // A workspace in sections (`?sections`): what is under `My files` and
      // `Shared with me` on disk. `lists` is every folder there by its path,
      // each a list of file names — a folder is one once it is a key.
      // `mine` is false while this person has no My files yet. What is
      // shared is not here: it is the status's `spaces`, as the engine says it.
      window.__sections = null;
      const fileNode = (dir, name) => ({ kind: "file", name, path: `${dir}/${name}` });
      const dirnameOf = (p) => p.slice(0, p.lastIndexOf("/"));
      const sectionNodes = (root) => {
        const sec = window.__sections;
        if (!sec || root !== "/docs") return [];
        const dirNode = (dir) => ({
          kind: "dir",
          name: basename(dir),
          path: dir,
          children: [
            ...Object.keys(sec.lists)
              .filter((d) => dirnameOf(d) === dir)
              .sort()
              .map(dirNode),
            ...sec.lists[dir].map((f) => fileNode(dir, f)),
          ],
        });
        return [...(sec.mine ? [`${root}/My files`] : []), `${root}/Shared with me`].filter((d) => sec.lists[d]).map(dirNode);
      };
      // The list of file names a path under /docs is in, and its name there —
      // what creating or moving a note has to touch for the tree to show it.
      const listOf = (path) => {
        const sec = window.__sections;
        const shared = sharedOf("/docs");
        const inShared = path.startsWith(`${shared}/`) ? path.slice(shared.length + 1).split("/") : [];
        if (inShared.length === 1) return { list: window.__treeFiles, name: inShared[0] };
        const parts = path.startsWith("/docs/") ? path.slice("/docs/".length).split("/") : [];
        if (window.__moved.has("/docs") && parts.length === 1) return { list: window.__strays, name: parts[0] };
        if (window.__moved.has("/docs") && parts.length === 2 && window.__strayDirs[parts[0]]) {
          return { list: window.__strayDirs[parts[0]], name: parts[1] };
        }
        const list = sec?.lists[dirnameOf(path)];
        return list ? { list, name: basename(path) } : null;
      };
      // What is shared at a workspace-relative path: a folder there, or a
      // document by any of its files.
      const stemOf = (rel) => rel.replace(/\.(md|html)$/i, "").replace(/\.meta\.jsonl$/i, "");
      const spacesOf = (root) => window.__cloud.statuses.find((st) => st.root === root)?.spaces ?? [];
      const shareAt = (root, rel, dir) =>
        spacesOf(root).find((sp) => sp.kind === (dir ? "folder" : "document") && sp.path !== "" && sp.path === (dir ? rel : stemOf(rel)));
      // The deepest section a workspace-relative path is in.
      const sectionAt = (root, rel) =>
        spacesOf(root)
          .filter((sp) => sp.path !== "" && (sp.kind === "document" ? stemOf(rel) === sp.path : rel === sp.path || rel.startsWith(`${sp.path}/`)))
          .sort((a, b) => (b.kind === "document") - (a.kind === "document") || b.path.length - a.path.length)[0] ?? null;
      window.__sectionAt = sectionAt;
      // The shared section's files, in the folder `dir`.
      // `__finderDirs`: folders somebody made in the shared section outside the app.
      const sharedNodes = (dir, all) => [
        projectsNode(dir),
        ...(window.__finderDirs ?? []).map((name) => ({ kind: "dir", name, path: `${dir}/${name}`, children: [] })),
        ...window.__treeFiles.map((f) => ({ kind: "file", name: f, path: `${dir}/${f}` })),
        ...(all ? window.__otherFiles.map((f) => ({ kind: "file", name: f, path: `${dir}/${f}`, supported: false })) : []),
      ];
      const treeFor = (path, all = false) => {
        if (path.endsWith("/Projects")) return projectsNode(path.slice(0, -"/Projects".length));
        const node = (children) => ({ kind: "dir", name: basename(path), path, children });
        // A moved folder's Library, asked for on its own (publishing it counts its notes).
        if (path.endsWith("/Library") && window.__moved.has(path.slice(0, -"/Library".length))) {
          return node(sharedNodes(path, all));
        }
        if (!window.__moved.has(path)) return node([...sharedNodes(path, all), ...sectionNodes(path)]);
        return node([
          { kind: "dir", name: "Library", path: `${path}/Library`, children: sharedNodes(`${path}/Library`, all) },
          ...sectionNodes(path),
          ...(path === "/docs"
            ? [
                ...Object.entries(window.__strayDirs).map(([name, files]) => ({
                  kind: "dir",
                  name,
                  path: `${path}/${name}`,
                  children: files.map((f) => fileNode(`${path}/${name}`, f)),
                })),
                ...window.__strays.map((f) => fileNode(path, f)),
              ]
            : []),
        ]);
      };
      const SLUG_ALPHABET = "abcdefghijkmnpqrstuvwxyz23456789";
      const randomSlug = () =>
        Array.from({ length: 8 }, () => SLUG_ALPHABET[Math.floor(Math.random() * SLUG_ALPHABET.length)]).join("");
      const sortPages = (pages) =>
        [...pages].sort(
          (a, b) => (a.kind === "dir" ? 0 : 1) - (b.kind === "dir" ? 0 : 1) || a.path.localeCompare(b.path),
        );

      // The fake engine.
      window.__cloud = {
        statuses: [],
        // What cloud_probe answers: a CloudProbe, or a string to reject with.
        probe: null,
        // What cloud_marker answers for any root — with `layout: "my-files"`
        // added for a folder that has moved, which also answers with one of
        // its status's when this is null.
        marker: null,
        // What the folder picker answers.
        pickedDir: "/Users/me/Downloads",
        // Where the engine keeps a workspace this Mac joins: one folder per
        // workspace under here, and no picker (src-tauri cloud_join).
        joinParent: "/Users/me/Doklin",
        // A string here is what the next cloud_join rejects with — once: a
        // download that died after the invite code was already spent.
        joinError: null,
        // What this Mac's credential may do, as the status reports it: every
        // action for the superadmin. A drive narrows it to a member's.
        can: ["work", "people.see", "people.invite", "people.recover", "people.remove", "people.roles", "agents.own", "agents.manage", "devices.own", "pages.manage", "workspace.manage"],
        // The key cloud_mint_token answers: what the setup and recovery
        // prompts carry, and what cloud_recover is asked to trade.
        token: "ab".repeat(32),
        // What cloud_recover answers with: the device sign-in the key buys.
        // `error`, when a string, is what the next trade rejects with.
        recovered: { token: "ef".repeat(32), error: null },
        // The superadmin's name, as the status carries it.
        superadmin: "Ada",
        // Who this Mac is on the scripted domain — what the engine resolved
        // its own signature to.
        me: "Sherin",
        // What a deployed worker reports; the drive sets it to the version
        // the app was built against (parsed from cloud-worker/src/version.ts).
        workerVersion: 1,
        // What the status's `versions` field carries: the version store's
        // mirror, or null before the domain has answered.
        versionsMirror: { mirrored: 0, cloud: 0, lastMirrorMs: null, horizonDays: null },
        // What the status's `usage` carries: today's requests and what the
        // day's limits are doing. A drive replaces it to script a mode.
        usage: {
          mode: "normal",
          cause: null,
          today: 0,
          fleetToday: null,
          cap: 100000,
          plan: "free",
          resumesAt: null,
          waiting: 0,
          liftable: false,
          lifted: false,
        },
        wipeResult: 42,
        // The invite the redeem door is scripted with. The engine does the
        // real parsing and the real trade (engine/src/cloud/invite.rs);
        // this only answers the way it would for the line pasted below.
        invite: {
          endpoint: "https://notes.example.com",
          code: "dkln-K7QM2-9XVR4-8TBHN-3WGYD",
          // Not the owner's token: that is the whole point of redeeming.
          token: "cd".repeat(32),
          member: { memberId: "m-1a2b3c4d", email: "bob@example.com", name: "Bob" },
          /** A string here is what cloud_redeem rejects with. */
          error: null,
        },
        // What the owner's own invite mints, in the clear, once.
        mintedCode: "dkln-9F4TR-2QWXM-7NBKD-5HGVZ",
        // The domain's agents, kept as real state like
        // the people below: adding one adds a row, a new login code replaces
        // the pending one, logging a machine out takes one away. Each is
        // somebody's (`memberId`): the list a command
        // answers is the asker's own, and everybody's for an owner, each
        // marked `mine` or not. `error`, when a string, is what every agent
        // command rejects with.
        agents: {
          list: [
            {
              id: "a-11111111",
              name: "Review bot",
              scopes: ["read", "comment"],
              createdAt: Date.now() - 2 * 86400000,
              lastUsedAt: Date.now() - 2 * 3600000,
              memberId: "m-owner",
              machines: [{ id: "t-box-1", host: "ci-runner-7", createdAt: Date.now() - 86400000 }],
              code: null,
            },
            {
              id: "a-22222222",
              name: "Bob’s helper",
              scopes: ["read", "edit"],
              createdAt: Date.now() - 86400000,
              lastUsedAt: null,
              memberId: "m-bob",
              machines: [{ id: "t-bob-box", host: "bobs-laptop", createdAt: Date.now() - 3600000 }],
              code: { id: "c-bob-1", createdAt: Date.now() - 60000, expiresAt: Date.now() + 50 * 60000 },
            },
          ],
          // The codes it mints, in the clear, in order.
          codes: ["dkla-7QK2M-9XVR4-8TBHN-3WGYD", "dkla-2B4D6-8FHKM-PRTVX-Z3579"],
          seq: 0,
          error: null,
        },
        // Who the scripted domain says is on the workspace.
        // The stub keeps this as real state — an invite adds a row, a
        // revoke takes one away — so a drive watches the list move rather
        // than watching a call be made.
        people: {
          // This Mac is signed in as the workspace's superadmin, Ada — on a
          // device row like anybody's.
          role: "superadmin",
          me: "m-owner",
          can: ["work", "people.see", "people.invite", "people.recover", "people.remove", "people.roles", "agents.own", "agents.manage", "devices.own", "pages.manage", "workspace.manage"],
          deviceId: "d-this-mac",
          // The row in `devices` that is this Mac's own credential: never
          // offered for signing out.
          tokenId: "t-this-mac",
          members: [
            {
              id: "m-owner",
              email: "ada@example.com",
              name: "Ada",
              role: "superadmin",
              createdAt: Date.now() - 7 * 86400000,
              lastSeenAt: Date.now() - 60000,
              devices: 1,
            },
            {
              id: "m-bob",
              email: "bob@example.com",
              name: "Bob",
              role: "member",
              createdAt: Date.now() - 6 * 86400000,
              lastSeenAt: Date.now() - 3600000,
              devices: 1,
            },
          ],
          invites: [],
          devices: [
            {
              id: "t-this-mac",
              memberId: "m-owner",
              email: "ada@example.com",
              deviceId: "d-this-mac",
              deviceName: "Ada’s MacBook Pro",
              createdAt: Date.now() - 7 * 86400000,
            },
            {
              id: "t-bob-1",
              memberId: "m-bob",
              email: "bob@example.com",
              deviceId: "d-bob",
              deviceName: "Bob’s MacBook",
              createdAt: Date.now() - 5 * 86400000,
            },
          ],
        },
        calls: [],
      };
      // The version store, scripted the same way:
      // versions_* answers from window.__versions, records itself in
      // its `calls`, and a restore actually writes the file and emits
      // `versions-applied`, so the app's reload path is exercised too.
      const HOUR = 3600000;
      const DAY = 86400000;
      const startOfToday = (() => {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      })();
      // Anchored to the start of a day, so which group a version falls in
      // never depends on what time the suite runs.
      const at = (daysAgo, hour) => startOfToday - daysAgo * DAY + hour * HOUR;
      const H = (c) => c.repeat(64);
      const snapshot = (ts, extra = {}) => ({
        ts,
        reason: "closing",
        files: 4,
        bytes: 400,
        pinned: false,
        label: null,
        restoredFrom: null,
        delta: null,
        ...extra,
      });
      const version = (ts, hash, extra = {}) => ({
        ts,
        hash,
        size: 120,
        by: "Test Mac",
        reason: "closing",
        label: null,
        pinned: false,
        restoredFrom: null,
        path: "other.md",
        source: "local",
        current: false,
        ...extra,
      });

      window.__versions = {
        // path → FileHistory. The drive replaces this wholesale to script a
        // mirrored version or an empty history.
        histories: {
          "/docs/other.md": {
            root: "/docs",
            currentHash: H("a"),
            versions: [
              version(at(0, 11), H("a"), { current: true }),
              version(at(0, 9), H("b"), { reason: "interval" }),
              version(at(1, 16), H("c"), { reason: "manual", pinned: true, label: "Before the rewrite" }),
              version(at(5, 10), H("d"), { reason: "seed" }),
            ],
          },
        },
        blobs: {
          [H("a")]: "# Other\n\nthe current text\n",
          [H("b")]: "# Other\n\nthis morning's text\n",
          [H("c")]: "# Other\n\nthe named version\n",
          [H("d")]: "# Other\n\nthe first text\n",
        },
        diff: "--- original\n+++ modified\n@@ -1,3 +1,3 @@\n # Other\n \n-the first text\n+the current text\n",
        // The workspace timeline: the retained moments, each with what
        // it changed against the one before it, and — per moment — what
        // restoring it would do to the folder as it stands.
        snapshots: [
          snapshot(at(0, 11), { reason: "closing", delta: { added: 1, removed: 0, changed: 2 } }),
          snapshot(at(0, 9), { reason: "interval", delta: { added: 0, removed: 1, changed: 1 } }),
          snapshot(at(1, 16), {
            reason: "manual",
            pinned: true,
            label: "Before the rewrite",
            delta: { added: 2, removed: 0, changed: 1 },
          }),
          snapshot(at(5, 10), { reason: "seed" }),
        ],
        // ts → SnapshotDiff.
        diffs: {
          [at(1, 16)]: {
            changed: [{ path: "other.md", thenHash: H("c"), nowHash: H("a") }],
            added: ["third.md"],
            missing: ["Projects/plan.md"],
          },
        },
        // What versions_deleted answers; the drive fills it in to make the
        // sidebar's row appear.
        deleted: [],
        // The settings surface: every store's status, every store on
        // this Mac, and what the horizon and export commands were asked.
        statuses: [
          {
            root: "/docs",
            key: "r-docs",
            phase: "idle",
            error: null,
            snapshots: 4,
            oldestMs: at(5, 10),
            newestMs: at(0, 11),
            lastCaptureMs: at(0, 11),
            bytes: { blobs: 2_000_000, snapshots: 48_000 },
            horizonDays: 90,
          },
        ],
        stores: [
          { key: "r-docs", root: "/docs", exists: true, bytes: 2_100_000, snapshots: 4, newestMs: at(0, 11) },
          { key: "r-old", root: "/Users/me/Gone", exists: false, bytes: 640_000, snapshots: 9, newestMs: at(40, 9) },
        ],
        // What the export answers, and how many progress ticks it sends.
        exported: { bytes: 3_400_000, files: 12 },
        forgotten: [],
        // Every workspace restore, as it was asked for.
        restores: [],
        calls: [],
        seq: 0,
      };
      const versionsFor = (path) =>
        window.__versions.histories[path] ?? { root: "/docs", currentHash: null, versions: [] };

      const record = (cmd, args) => window.__cloud.calls.push({ cmd, args });
      const recordVersion = (cmd, args) => window.__versions.calls.push({ cmd, args });
      const hostOf = (endpoint) => endpoint.replace(/^https?:\/\//, "").replace(/\/.*$/, "");
      const statusFor = (root, endpoint, name, wsId) => ({
        root,
        domain: hostOf(endpoint),
        endpoint,
        wsId,
        name,
        phase: "idle",
        lastSyncMs: Date.now(),
        error: null,
        pendingDeletes: 0,
        pendingAdds: 0,
        usage: { ...window.__cloud.usage },
        // What this Mac signs with here: the person the domain says it is.
        me: window.__cloud.me,
        meId: window.__cloud.people.me,
        can: window.__cloud.can,
        superadmin: window.__cloud.superadmin,
        workerVersion: window.__cloud.workerVersion,
        versions: window.__cloud.versionsMirror,
        public: [],
        presence: [],
        leases: [],
        spaces: [],
      });

      // The listener registry the app's listen() lands in (see the
      // plugin:event|listen case) and the emitter a drive uses.
      window.__listeners = new Map(); // event → [{ id, handler }]
      let nextListenerId = 1;
      window.__emit = (event, payload) => {
        for (const { id, handler } of window.__listeners.get(event) ?? []) {
          handler({ event, id, payload });
        }
      };
      window.__setStatuses = (statuses) => {
        window.__cloud.statuses = statuses;
        window.__emit("cloud-status", statuses);
      };
      const patchStatus = (root, patch) =>
        window.__setStatuses(
          window.__cloud.statuses.map((s) => (s.root === root ? { ...s, ...patch } : s)),
        );
      const delay = (ms) => new Promise((r) => setTimeout(r, ms));
      const progress = async (root, kind, total) => {
        for (let done = 1; done <= total; done += 1) {
          await delay(120);
          window.__emit("cloud-progress", { root, kind, done, total });
        }
      };

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main", windowLabel: "main" },
        },
        transformCallback: (cb) => cb,
        invoke: (cmd, args) => {
          if (cmd.startsWith("cloud_")) record(cmd, args);
          if (cmd.startsWith("versions_")) recordVersion(cmd, args);
          switch (cmd) {
            // Nothing opened from outside the app is waiting for this window.
            case "take_window_shows":
              return Promise.resolve([]);
            case "take_window_init":
              return Promise.resolve({
                isMain: true,
                folder: null,
                file: null,
                tabs: [],
                activeId: null,
                restored: false,
              });
            case "take_pending_folder":
              return Promise.resolve(null);
            case "read_file": {
              const c = window.__fs.get(args.path);
              return c === undefined
                ? Promise.reject(`no such file: ${args.path}`)
                : Promise.resolve({ contents: c, snapshot: snap(c) });
            }
            case "write_file": {
              window.__fs.set(args.path, args.contents);
              window.__writes.push(args.path);
              return Promise.resolve(snap(args.contents));
            }
            case "path_exists":
              return Promise.resolve(
                window.__dirs.has(args.path) || args.path.startsWith("/Users/me/Downloads") || window.__fs.has(args.path),
              );
            case "list_md_tree": {
              window.__treeCalls += 1;
              return Promise.resolve(treeFor(args.path, !!args.all));
            }
            case "stat_file": {
              const c = window.__fs.get(args.path);
              return c === undefined ? Promise.reject("missing") : Promise.resolve(snap(c));
            }
            case "watch_file": {
              const c = window.__fs.get(args.path) ?? "";
              return Promise.resolve(snap(c));
            }
            case "unwatch_file":
              return Promise.resolve(null);
            case "device_name":
              return Promise.resolve("Test Mac");
            case "untitled_dir":
              return Promise.resolve("/untitled");
            case "orphaned_untitled":
              return Promise.resolve([]);
            case "discard_untitled":
              window.__fs.delete(args.path);
              return Promise.resolve(null);
            case "open_external":
              (window.__opened ??= []).push(args.url);
              return Promise.resolve(null);
            // The updater, unavailable unless a drive scripts it before the
            // page loads: `__update` is what the check finds (the plugin's
            // metadata, `rawJson` the manifest; null for none), `__install`
            // what the download does with its channel (its promise is the
            // download's), `__appVersion` the running version.
            case "plugin:app|version":
              return Promise.resolve(window.__appVersion ?? null);
            case "plugin:updater|check":
              (window.__updaterCalls ??= []).push(cmd);
              return window.__update === undefined
                ? Promise.reject("updater unavailable in harness")
                : Promise.resolve(window.__update);
            case "plugin:updater|download_and_install":

                path: dir ? rel : stemOf(rel),
                by: window.__cloud.me,
                owner: around.owner,
                parent: around.id,
                placed: true,
                members: args.members,
                // Whoever opens the folder it sits in opens it too.
                above: around.kind === "private" ? [around.owner] : [...new Set([...around.members, ...around.above])],
                deletedAt: null,
              };
              // What is shared from inside it sits in it from now on.
              const spaces = s.spaces.map((sp) => (dir && sp.parent === around.id && sp.path.startsWith(`${rel}/`) ? { ...sp, parent: space.id } : sp));
              patchStatus(args.root, { spaces: [...spaces, space] });
              return Promise.resolve(space);
            }
            case "cloud_share_member":
            case "cloud_share_delete":
            case "cloud_share_restore": {
              const sec = window.__sections;
              const s = window.__cloud.statuses.find((st) => st.root === args.root);
              const space = s?.spaces.find((sp) => sp.id === args.id);
              const gone = "That is not there any more, or it is no longer shared with you.";
              if (!sec || !space) return Promise.reject(gone);
              const me = window.__cloud.people.me;
              const kept = (window.__cloud.keptShares ??= {});
              if (cmd === "cloud_share_restore") {
                const was = kept[space.id];
                if (space.deletedAt === null || !was) return Promise.reject("That can't be restored any more: its thirty days are up, or it was restored already.");
                Object.assign(sec.lists, was.lists);
                for (const [path, c] of was.files) window.__fs.set(path, c);
                if (was.file) sec.lists[was.file.dir].push(was.file.name);
                delete kept[space.id];
                patchStatus(args.root, { spaces: s.spaces.map((sp) => (sp.id === space.id ? { ...sp, path: was.path, deletedAt: null } : sp)) });
                window.__emit("cloud-applied", { root: args.root, paths: [was.path] });
                return Promise.resolve(null);
              }
              if (cmd === "cloud_share_delete" && !space.placed) {
                return Promise.reject("This is shared with you: only the people of the folder it sits in can move or delete it. You can leave it instead.");
              }
              if (cmd === "cloud_share_member" && !args.add && space.above.includes(args.memberId)) {
                return Promise.reject("They can open the folder this sits in, and nothing in a folder is kept from that folder's people.");
              }
              const leaves = cmd === "cloud_share_delete" || (!args.add && args.memberId === me && !space.placed);
              if (leaves) {
                // It leaves this Mac: the engine takes its copy away, and
                // says so. Deleted, the domain keeps it thirty days.
                const abs = `${args.root}/${space.path}`;
                const lists = {};
                const files = [];
                let file = null;
                if (space.kind === "folder") {
                  for (const dir of Object.keys(sec.lists).filter((d) => d === abs || d.startsWith(`${abs}/`))) {
                    lists[dir] = sec.lists[dir];
                    delete sec.lists[dir];
                  }
                  for (const [path, c] of [...window.__fs]) {
                    if (!path.startsWith(`${abs}/`)) continue;
                    files.push([path, c]);
                    window.__fs.delete(path);
                  }
                } else {
                  const list = sec.lists[dirnameOf(abs)] ?? [];
                  const name = list.find((n) => stemOf(n) === basename(abs));
                  if (name) {
                    list.splice(list.indexOf(name), 1);
                    file = { dir: dirnameOf(abs), name };
                    files.push([`${dirnameOf(abs)}/${name}`, window.__fs.get(`${dirnameOf(abs)}/${name}`) ?? ""]);
                  }
                }
                const inside = (sp) => sp.id !== space.id && space.kind === "folder" && sp.path.startsWith(`${space.path}/`);
                const spaces =
                  cmd === "cloud_share_delete"
                    ? s.spaces.filter((sp) => !inside(sp)).map((sp) => (sp.id === space.id ? { ...sp, path: "", deletedAt: Date.now() } : sp))
                    : s.spaces.filter((sp) => sp.id !== space.id && !inside(sp));
                if (cmd === "cloud_share_delete") kept[space.id] = { path: space.path, lists, files, file };
                patchStatus(args.root, { spaces });
                window.__emit("cloud-space-left", { root: args.root, name: space.name, path: space.path });
                return Promise.resolve(null);
              }
              const members = args.add
                ? [...new Set([...space.members, args.memberId])]
                : space.members.filter((m) => m !== args.memberId);
              patchStatus(args.root, { spaces: s.spaces.map((sp) => (sp.id === space.id ? { ...sp, members } : sp)) });
              return Promise.resolve(null);
            }

            /* ----- every public address, an owner's ----- */
            case "cloud_pages":
              return typeof window.__cloud.everyPages === "string"
                ? Promise.reject(window.__cloud.everyPages)
                : Promise.resolve(window.__cloud.everyPages ?? { pages: [], truncated: false });
            case "cloud_page_take_down": {
              const every = window.__cloud.everyPages;
              if (every && typeof every !== "string") every.pages = every.pages.filter((p) => p.slug !== args.slug);
              return Promise.resolve(null);
            }

            /* ----- the public map, as the engine would keep it ----- */
            // *Copy link*: the engine's answer, as engine/src/cloud/link.rs
            // writes it — a file in no section has none.
            case "cloud_link": {
              const s = window.__cloud.statuses.find((st) => args.path.startsWith(`${st.root}/`));
              if (!s) return Promise.reject("that file isn't in a workspace that syncs, so it has no link");
              const rel = args.path.slice(s.root.length + 1);
              const space = sectionAt(s.root, rel);
              const shared = rel.toLowerCase().split("/")[0] === "library";
              if (!space && !shared) {
                return Promise.reject("that file is in no section, so it syncs nowhere and has no link");
              }
              const alone = space && [...space.members, ...space.above].every((m) => m === window.__cloud.people.me);
              const who = !space
                ? `Everyone in ${s.name} can open it.`
                : space.kind === "private" || alone
                  ? "Only you can open it, on any device of yours."
                  : `Only the people “${space.name}” is shared with can open it.`;
              const file = `f-${(rel.length * 7919).toString(16).padStart(12, "0").slice(-12)}`;
              const url = `https://doklin.cc/open#d=${s.domain}&w=${s.wsId}${space ? `&s=${space.id}` : ""}&f=${file}`;
              return Promise.resolve({ url, who });
            }
            case "cloud_publish": {
              const s = window.__cloud.statuses.find(
                (st) => args.path === st.root || args.path.startsWith(`${st.root}/`),
              );
              if (!s) return Promise.reject("that path isn't in a connected workspace");
              // The workspace's top is in no section: Library is what publishes the shared one.
              if (args.path === s.root) return Promise.reject("the workspace's folder is in no section, so it has nothing to publish");
              const rel = args.path.slice(s.root.length + 1);
              const kind = window.__dirs.has(args.path) ? "dir" : "file";
              const existing = s.public.find((p) => p.kind === kind && p.path === rel) ?? null;
              const slug = args.slug ? args.slug.trim().toLowerCase() : (existing?.slug ?? randomSlug());
              if (args.slug && !/^[a-z0-9][a-z0-9-]{2,63}$/.test(slug)) {
                return Promise.reject(
                  "a slug is 3 to 64 characters: lowercase letters, digits and dashes, starting with a letter or digit",
                );
              }
              const taken = s.public.find((p) => p.slug === slug && p !== existing);
              if (taken) return Promise.reject(`"${slug}" is already the address of ${taken.path}`);
              const entry = {
                slug,
                kind,
                path: rel,
                title: args.title ?? null,
                desc: args.desc ?? null,
                // Signed the way the engine signs it: with whoever this Mac
                // is on this domain, resolved to a name before it gets here.
                by: window.__cloud.me,
                at: Date.now(),
                alive: true,
                root: existing?.root ?? false,
              };
              patchStatus(s.root, { public: sortPages([...s.public.filter((p) => p !== existing), entry]) });
              return Promise.resolve(slug);
            }
            case "cloud_unpublish": {
              const s = window.__cloud.statuses.find((st) => st.root === args.root);
              if (!s || !s.public.some((p) => p.slug === args.slug)) return Promise.reject("that page isn't published");
              patchStatus(s.root, { public: s.public.filter((p) => p.slug !== args.slug) });
              return Promise.resolve(null);
            }
            case "cloud_set_root": {
              const s = window.__cloud.statuses.find((st) => st.root === args.root);
              if (!s) return Promise.reject("that workspace isn't connected");
              patchStatus(s.root, { public: s.public.map((p) => ({ ...p, root: args.slug != null && p.slug === args.slug })) });
              return Promise.resolve(null);
            }
            default:
              return Promise.resolve(null);
          }
        },
      };

      // The API's unlisten path dereferences this global.
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: (event, id) => {
          const list = (window.__listeners.get(event) ?? []).filter((l) => l.id !== id);
          window.__listeners.set(event, list);
        },
      };

      // A restorable /docs workspace session so the sidebar renders.
      localStorage.clear();
      localStorage.setItem(
        "doklin:session",
        JSON.stringify({
          version: 2,
          lastRoot: "/docs",
          sessions: {
            "/docs": {
              tabs: [{ id: "t-notes", kind: "file", path: `${S}/notes.md` }],
              activeId: "t-notes",
            },
          },
        }),
      );
      // `?sections`: the app starts in a connected workspace that is in
      // sections — this person (the superadmin) has a My files with notes
      // in it, a folder there shared with Bob, and a folder and a document
      // Carol shared with them. A note sits straight under Shared with me
      // that nobody shared, and somebody's My files has published a page
      // this owner cannot open.
      if (new URLSearchParams(location.search).has("sections")) {
        const me = "m-sherin";
        const member = (id, name, extra = {}) => ({
          id,
          email: `${name.toLowerCase()}@example.com`,
          name,
          role: "member",
          createdAt: Date.now() - 6 * 86400000,
          lastSeenAt: Date.now() - 3600000,
          devices: 1,
          ...extra,
        });
        window.__cloud.people.me = me;
        window.__cloud.people.members = [
          member(me, "Sherin", { role: "superadmin" }),
          member("m-bob", "Bob"),
          member("m-carol", "Carol"),
        ];
        // My files: a journal and a plan, a folder shared with Bob (Finance)
        // and one shared with nobody (Work). Shared with me: a folder and a
        // document Carol shared, and a note nobody shared.
        window.__sections = {
          mine: true,
          lists: {
            "/docs/My files": ["journal.md", "plan.md"],
            "/docs/My files/Finance": ["budget.md"],
            "/docs/My files/Work": ["notes.md"],
            "/docs/Shared with me": ["Roadmap.md", "stray.md"],
            "/docs/Shared with me/Board": ["minutes.md"],
          },
        };
        window.__fs.set("/docs/My files/journal.md", "# Journal\n\nOnly mine.\n");
        window.__fs.set("/docs/My files/plan.md", "# Plan\n\nMine, for now.\n");
        window.__fs.set("/docs/My files/Finance/budget.md", "# Budget\n\nNumbers.\n");
        window.__fs.set("/docs/My files/Work/notes.md", "# Notes\n\nWork.\n");
        window.__fs.set("/docs/Shared with me/Roadmap.md", "# Roadmap\n\nCarol's.\n");
        window.__fs.set("/docs/Shared with me/stray.md", "# Stray\n");
        window.__fs.set("/docs/Shared with me/Board/minutes.md", "# Minutes\n");
        for (const dir of Object.keys(window.__sections.lists)) window.__dirs.add(dir);
        // What Finder or an agent put at the workspace's top, in no section.
        window.__strays = ["todo.md"];
        window.__strayDirs = { Scratch: [] };
        window.__fs.set("/docs/todo.md", "# Todo\n");
        window.__dirs.add("/docs/Scratch");
        window.__cloud.everyPages = {
          pages: [
            { slug: "carols-notes", kind: "dir", title: "Carol's notes", by: "Carol", at: Date.now() - 2 * 86400000, shared: false },
          ],
          truncated: false,
        };
        window.__cloud.statuses = [
          {
            ...statusFor("/docs", "https://notes.example.com", "Notes", "w-1"),
            spaces: [
              { id: "p-sherin00", kind: "private", name: "My files", path: "My files", by: "Sherin", owner: me, parent: null, placed: true, members: [me], above: [], deletedAt: null },
              // Shared by this person, where they keep it.
              { id: "s-finance0", kind: "folder", name: "Finance", path: "My files/Finance", by: "Sherin", owner: me, parent: "p-sherin00", placed: true, members: ["m-bob"], above: [me], deletedAt: null },
              // Shared with this person: where they sit is their owner's to say.
              { id: "s-board000", kind: "folder", name: "Board", path: "Shared with me/Board", by: "Carol", owner: "m-carol", parent: null, placed: false, members: [me, "m-bob"], above: ["m-carol"], deletedAt: null },
              { id: "s-roadmap0", kind: "document", name: "Roadmap", path: "Shared with me/Roadmap", by: "Carol", owner: "m-carol", parent: null, placed: false, members: [me], above: ["m-carol"], deletedAt: null },
            ],
          },
        ];
      }
      // `?removed-at-launch`: the app starts where a workspace it was last in
      // has ALREADY been taken off this Mac — the engine heard it on first
      // contact, before this window was listening, so there is no event to
      // hear: only the list (`cloud_removed`), and a saved session that
      // still points at a folder that is gone.
      if (new URLSearchParams(location.search).has("removed-at-launch")) {
        const gone = "/Users/me/Doklin/Notes";
        window.__cloud.removed = [
          { root: gone, name: "Notes", domain: "notes.example.com", deleted: true, at: 1700000000000 },
        ];
        localStorage.setItem(
          "doklin:session",
          JSON.stringify({
            version: 2,
            lastRoot: gone,
            sessions: {
              [gone]: {
                tabs: [{ id: "t-gone", kind: "file", path: `${gone}/plan.md` }],
                activeId: "t-gone",
              },
            },
          }),
        );
      }
    </script>
    <div id="root"></div>
    <script type="module" src="./cloud.tsx"></script>
  </body>
</html>
