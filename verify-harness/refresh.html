<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Visual refresh harness</title>
    <style>
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <script>
      // Tauri IPC stub broad enough to boot the REAL <App/>: an in-memory
      // file system behind read/write/stat/watch, window-init answers for a
      // bare no-workspace launch, and a device name for the comment author. The
      // updater plugin rejects (its caller catches into the "error" phase).
      // Everything else resolves null — every remaining caller either
      // ignores the result or catches.
      const para = (seed, n) =>
        Array.from(
          { length: n },
          (_, i) =>
            `Paragraph ${i + 1} of ${seed}. The quick brown fox jumps over the lazy dog, ` +
            `again and again, so the document grows tall enough to scroll.`,
        ).join("\n\n");
      const htmlDoc = (title, n) =>
        `<!doctype html><html><head><meta charset="utf-8"><title>${title}</title></head><body>` +
        `<main><h1>${title}</h1>` +
        Array.from(
          { length: n },
          (_, i) => `<p id="p${i + 1}">Rendition block ${i + 1} for ${title}.</p>`,
        ).join("") +
        `</main></body></html>`;

      window.__fs = new Map([
        ["/docs/notes.md", `# Quarterly planning notes

The team met on Tuesday to settle the **roadmap** for the next quarter. The short version: we ship the [sync engine](https://example.com/sync) first, then revisit *offline editing* once the numbers are in. Everything else waits.

## What we agreed

- Cloud sync goes to every workspace by the end of the month
- The board view gets card excerpts and a cleaner header
- Published pages pick up the same type as the app

- [x] Draft the rollout note
- [ ] Book the design review
- [ ] Confirm the release date with support

> Good writing tools disappear. You notice the words, not the window around them.

### Open questions

Do we keep \`excerpt: false\` as the only stored flag? The current answer is yes, because older builds rewrite unknown keys away.

\`\`\`ts
export function resolveTheme(t: Theme): ResolvedTheme {
  if (t !== "system") return t;
  return darkSchemeQuery?.matches ? "dark" : "light";
}
\`\`\`

| Phase | Scope | Days |
| --- | --- | --- |
| 0 | Foundations | 1–2 |
| 1 | Colour and type | 2–3 |
| 2 | Window layout | 3–4 |

---

A closing paragraph long enough to wrap a few times, so the measure and the leading are easy to judge at a glance. The quick brown fox jumps over the lazy dog, and then it does it again.
`],
        ["/docs/notes.html", htmlDoc("Notes rendition", 80)],
        ["/docs/other.md", `# Other\n\n${para("other", 40)}\n`],
        ["/docs/third.md", `# Third\n\n${para("third", 40)}\n`],
        // A note that links to its neighbours — the internal half of
        // click-to-follow (src/linkOpen.ts → App's followDocLink).
        [
          "/docs/linked.md",
          `# Linked\n\nSee [the other note](./other.md) and ` +
            `[a missing one](./gone.md), plus [the web](https://example.com/).\n`,
        ],
      ]);
      window.__mtime = 1000;
      window.__writes = [];
      const snap = (c) => ({ mtime_ms: ++window.__mtime, size: c.length });

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main", windowLabel: "main" },
        },
        transformCallback: (cb) => cb,
        invoke: (cmd, args) => {
          switch (cmd) {
            case "take_window_init":
              return Promise.resolve({
                isMain: true,
                folder: null,
                file: null,
                files: [],
                activeFile: null,
                restored: false,
              });
            case "take_pending_folder":
            case "migrate_scratch":
              return Promise.resolve(null);
            case "read_file": {
              const c = window.__fs.get(args.path);
              return c === undefined
                ? Promise.reject(`no such file: ${args.path}`)
                : Promise.resolve({ contents: c, snapshot: snap(c) });
            }
            case "write_file": {
              window.__fs.set(args.path, args.contents);
              window.__writes.push(args.path);
              return Promise.resolve(snap(args.contents));
            }
            case "path_exists":
              return Promise.resolve(args.path === "/docs" || window.__fs.has(args.path));
            case "list_md_tree":
              return Promise.resolve({
                kind: "dir",
                name: "docs",
                path: "/docs",
                children: [
                  { kind: "file", name: "notes.md", path: "/docs/notes.md", paired: true },
                  { kind: "file", name: "other.md", path: "/docs/other.md" },
                  { kind: "file", name: "third.md", path: "/docs/third.md" },
                  { kind: "file", name: "linked.md", path: "/docs/linked.md" },
                ],
              });
            case "stat_file": {
              const c = window.__fs.get(args.path);
              return c === undefined
                ? Promise.reject("missing")
                : Promise.resolve(snap(c));
            }
            case "watch_file": {
              const c = window.__fs.get(args.path) ?? "";
              window.__watched = [args.path, ...(args.extras ?? [])];
              return Promise.resolve(snap(c));
            }
            case "unwatch_file":
              window.__watched = [];
              return Promise.resolve(null);
            case "cloud_status":
              return Promise.resolve([]);
            case "cloud_set_activity":
              return Promise.resolve(null);
            case "device_name":
              return Promise.resolve("Test Mac");
            case "list_drafts":
              return Promise.resolve([]);
            case "open_external":
              (window.__opened ??= []).push(args.url);
              return Promise.resolve(null);
            case "plugin:updater|check":
              return Promise.reject("updater unavailable in harness");
            case "plugin:event|listen":
              return Promise.resolve(1);
            default:
              return Promise.resolve(null);
          }
        },
      };

      // The API's unlisten path dereferences this global; a no-op keeps
      // StrictMode's mount→unmount→remount cycle quiet.
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };

      // A restorable /docs workspace session (the sidebar renders — the
      // drive walks tree-drag and sidebar-resize): two file tabs, notes
      // active. Seeded ONCE per browser context — a reload must keep what
      // the app itself persisted (the drive's restore round-trip).
      if (!localStorage.getItem("doklin:harness-seeded")) {
        localStorage.clear();
        localStorage.setItem("doklin:harness-seeded", "1");
        localStorage.setItem(
          "doklin:session",
          JSON.stringify({
            version: 2,
            lastRoot: "/docs",
            sessions: {
              "/docs": {
                tabs: [
                  { id: "t-notes", kind: "file", path: "/docs/notes.md" },
                  { id: "t-other", kind: "file", path: "/docs/other.md" },
                ],
                activeId: "t-notes",
              },
            },
          }),
        );
      }
    </script>
    <div id="root"></div>
    <script type="module" src="./split.tsx"></script>
  </body>
</html>
