[package]
name = "doklin"
version = "0.1.142"
description = "Markdown editor"
authors = ["Sherin"]
edition = "2021"

[lib]
name = "doklin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Async plumbing for the PDF export and the engine's runtime handle (tauri
# already ships tokio; the direct dep names the features they use).
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
notify = "6"
notify-debouncer-full = "0.3"
# The sync engine and the version store (engine/), shared with the iPhone
# app: this crate is its Tauri commands and its host.
doklin-engine = { path = "../engine" }
# PDF export (src/pdf_export.rs): a hand-rolled CDP client over websocket
# drives the pinned headless-Chromium engine, and the validation gate reads
# the emitted PDF (structure via lopdf — default features off, its `time`
# datetime feature doesn't compile; text via pdf-extract, which builds its
# own lopdf 0.42 so features never unify with ours). The engine download is
# fetched over HTTPS and sha256-verified, into a randomly named staging dir.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
getrandom = "0.2"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
lopdf = { version = "0.44", default-features = false }
pdf-extract = "0.12.0"
base64 = "0.23.1"
pdfium-render = "0.9.3"
png = "0.18.1"

# In-app auto-updater (desktop only, per Tauri's plugin guidance).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# macOS-only: trashing files via NSFileManager (see trash_file in lib.rs). This
# app currently targets macOS only. If we ever go cross-platform,
# grep for "macOS-only" to find every spot that needs a portable fallback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
