[package]
name = "doklin"
version = "0.1.75"
description = "Markdown editor"
authors = ["Sherin"]
edition = "2021"

[lib]
name = "doklin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Dictation sidecar request/response plumbing (tauri already ships tokio; the
# direct dep is for oneshot + timeout in src/dictation.rs).
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
notify = "6"
notify-debouncer-full = "0.3"
# The cloud engine (src/cloud/): HTTPS to the workspace's worker, content
# hashing, three-way merge for concurrent edits, random ids and tokens, and
# local-time labels on conflict copies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
diffy = "0.4"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Versioning (src/versions/): the snapshot store gzips its blobs and its
# snapshot files. flate2 is pure Rust (miniz_oxide) and was already in the
# lockfile as a transitive dependency — no new C build on any platform.
flate2 = "1"
# PDF export (src/pdf_export.rs): a hand-rolled CDP client over websocket
# drives the pinned headless-Chromium engine, and the validation gate reads
# the emitted PDF (structure via lopdf — default features off, its `time`
# datetime feature doesn't compile; text via pdf-extract, which builds its
# own lopdf 0.42 so features never unify with ours).
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
lopdf = { version = "0.44", default-features = false }
pdf-extract = "0.12.0"
base64 = "0.23.1"
pdfium-render = "0.9.3"
png = "0.18.1"

[dev-dependencies]
tempfile = "3"
# Paused virtual time for the engine's settle-timing tests (src/cloud/tests.rs).
tokio = { version = "1", features = ["test-util"] }

# In-app auto-updater (desktop only, per Tauri's plugin guidance).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# macOS-only: trashing files via NSFileManager (see trash_file in lib.rs). This
# app currently targets macOS only — see the README. If we ever go cross-platform,
# grep for "macOS-only" to find every spot that needs a portable fallback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
