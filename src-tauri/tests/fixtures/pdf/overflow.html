<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Overflowing fixture</title>
<style>
  @page { size: 4in 4in; margin: 0; }
  html, body { margin: 0; padding: 0; font-family: Helvetica, sans-serif; }
  .page { width: 4in; height: 4in; }
  .too-tall { height: 7in; background: #ffe8e8; padding: 12px; box-sizing: border-box; }
</style>
</head>
<body>
  <div class="page">
    <div class="too-tall">
      <p>This single declared page container holds content nearly twice its
         height, so Chromium must spill onto a second physical page. The DOM
         predicts one page; the PDF will have two; the exporter must refuse.</p>
    </div>
  </div>
</body>
</html>
