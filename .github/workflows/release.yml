name: release

# Every push to main cuts a release, unless it only touches site/:
#   1. `bump` computes the next version — a patch bump of the latest `v*` tag.
#      To cut a minor/major instead, raise `version` in src-tauri/tauri.conf.json
#      in your commit; a file version higher than the latest tag is used verbatim.
#      The version is stamped into package.json, src-tauri/tauri.conf.json,
#      and both crates' Cargo.toml and Cargo.lock (the app in src-tauri/, the
#      `doklin` command in cli/), committed back to main and tagged vX.Y.Z.
#   2. `build-cli` builds the `doklin` command for Linux (x64 and arm64,
#      static musl binaries) from that tag.
#   3. `build-release` builds the Apple Silicon (arm64-only — Intel is not
#      supported) macOS .dmg via Tauri (Developer ID signed + notarized +
#      stapled — REQUIRED, the job fails loudly if the signing secrets are
#      absent; there is no unsigned fallback) and publishes a GitHub Release
#      for that tag, marked latest, so
#        https://github.com/boat-builder/doklin/releases/latest/download/Doklin-macos-arm64.dmg
#      always resolves to the newest build. It also builds the macOS `doklin`
#      command — signed, inside the app at Contents/Helpers/doklin — and
#      attaches it beside the two Linux ones with their installer, so
#        curl -fsSL https://github.com/boat-builder/doklin/releases/latest/download/install-doklin.sh | sh
#      always installs the newest one.
#
# The bump commit is pushed with GITHUB_TOKEN, and GitHub never triggers
# workflows from GITHUB_TOKEN pushes — so the bump cannot re-trigger this
# workflow (the [skip ci] in its message is belt-and-braces). That is also why
# the release builds in the SAME run instead of a separate on-tag workflow: a
# GITHUB_TOKEN-pushed tag would not fire it.
#
# Signing secrets reuse bluesnake's exact names — copy the values over:
#   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, MACOS_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# (no KEYCHAIN_PWD needed — Tauri creates its own ephemeral keychain).
#
# Auto-updater signing (doklin-specific, generated with `tauri signer generate`):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# These sign the .app.tar.gz the updater plugin installs; the matching public key
# lives in src-tauri/tauri.conf.json (plugins.updater.pubkey).
#
# workflow_dispatch cuts a release manually (same bump + build path).

on:
  push:
    branches: [main]
    # The doklin.cc page ships with `wrangler deploy`, not with the app: a push
    # that touches nothing but site/ cuts no release.
    paths-ignore:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write   # push bump commit + tag, create the GitHub Release

# Serialize runs: a second push during a release waits, then checks out the
# just-bumped main head, so its version bump lands on top (never non-fast-forward).
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------- version bump
  bump:
    name: Bump version + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main         # branch head (not the trigger SHA) — see concurrency note
          fetch-depth: 0    # need all tags to find the latest release

      - name: Compute next version
        id: v
        run: |
          set -euo pipefail
          file_v="$(jq -r .version src-tauri/tauri.conf.json)"
          last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$last_tag" ]; then
            next="$file_v"   # first release ships the committed version as-is
          else
            tag_v="${last_tag#v}"
            IFS=. read -r maj min pat <<<"$tag_v"
            next="$maj.$min.$((pat+1))"
            # A manually raised file version (minor/major bump) beats the auto patch bump.
            if [ "$file_v" != "$tag_v" ] && \
               [ "$(printf '%s\n%s\n' "$file_v" "$tag_v" | sort -V | tail -n1)" = "$file_v" ]; then
              next="$file_v"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::tag v$next already exists — delete it or raise the version in tauri.conf.json"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous tag: ${last_tag:-none})"

      - name: Stamp version into package.json, tauri.conf.json and both crates
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # sed (first match only) instead of jq so the JSON formatting is untouched
          sed -i -E "0,/\"version\": *\"[^\"]+\"/s//\"version\": \"$VERSION\"/" package.json
          sed -i -E "0,/\"version\": *\"[^\"]+\"/s//\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          for f in "$(jq -r .version package.json)" "$(jq -r .version src-tauri/tauri.conf.json)"; do
            [ "$f" = "$VERSION" ] || { echo "::error::version stamp failed"; exit 1; }
          done
          # A crate: its Cargo.toml, and its own entry in its Cargo.lock (the
          # version is the line after the name). The `doklin` command is built
          # with --locked, so a lock left behind fails its build.
          stamp_crate() { # $1 = directory, $2 = package name
            sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" "$1/Cargo.toml"
            grep -q "^version = \"$VERSION\"$" "$1/Cargo.toml" || { echo "::error::$1/Cargo.toml stamp failed"; exit 1; }
            awk -v ver="$VERSION" -v name="name = \"$2\"" '
              prev == name && /^version = / { $0 = "version = \"" ver "\"" }
              { prev = $0; print }
            ' "$1/Cargo.lock" > Cargo.lock.tmp
            mv Cargo.lock.tmp "$1/Cargo.lock"
            grep -A1 "^name = \"$2\"$" "$1/Cargo.lock" | grep -q "^version = \"$VERSION\"$" ||
              { echo "::error::$1/Cargo.lock stamp failed"; exit 1; }
          }
          stamp_crate src-tauri doklin
          stamp_crate cli doklin-cli

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Files already at $VERSION (first release) — tagging without a commit"
          else
            git commit -m "chore: release v$VERSION [skip ci]"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "refs/tags/v$VERSION"

  # ------------------------------------------- the `doklin` command for Linux
  # Static musl binaries, so one file runs on any distribution a bot lives on
  # — Debian, Alpine, a scratch container. Each is built natively on a runner
  # of its own architecture: the TLS library carries C and assembly, and a
  # native musl-gcc is all that takes. The macOS binary is built by
  # `build-release`, which collects these two and publishes all three.
  build-cli:
    name: Build doklin CLI (${{ matrix.asset }})
    needs: bump
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - asset: doklin-linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - asset: doklin-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.bump.outputs.version }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      # The C in the build goes through musl's own compiler wrapper, named
      # outright so nothing depends on how the `cc` crate guesses.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.tag }}   # the exact stamped commit

      - name: Install the musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target "$TARGET"

      # A binary that needs a shared library would run here and fail on a
      # bot's machine; one that reports another version means the stamp and
      # the build disagree. Either is caught before anything is published.
      - name: Check it is static, runs, and carries this release's version
        run: |
          set -euo pipefail
          BIN="cli/target/$TARGET/release/doklin"
          if readelf -d "$BIN" | grep -q '(NEEDED)'; then
            echo "::error::$BIN needs shared libraries:"; readelf -d "$BIN" | grep '(NEEDED)'; exit 1
          fi
          [ "$("$BIN" --version)" = "doklin $VERSION" ] ||
            { echo "::error::$BIN reports '$("$BIN" --version)', not 'doklin $VERSION'"; exit 1; }
          "$BIN" help >/dev/null
          mkdir -p cli-assets
          cp "$BIN" "cli-assets/$ASSET"
          ls -la cli-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------- macOS build + GitHub Release
  build-release:
    name: Build .dmg (arm64, signed + notarized) and release
    # build-cli is needed, not just awaited: its two binaries are release
    # assets, and a release without them breaks the installer for everyone.
    needs: [bump, build-cli]
    runs-on: macos-15
    # GitHub's hard per-job ceiling. Apple occasionally holds a submission far
    # longer than any CI job can wait (bluesnake's account-warm-up took days) —
    # if that happens the job fails; recover with "Re-run failed jobs", which
    # reuses the bump job's tag and simply resubmits.
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.bump.outputs.version }}
    steps:
      # No unsigned fallback: fail here, before the expensive build, if any
      # signing/notarization secret is missing.
      - name: Require signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          # Apple secrets — shared with bluesnake (see header comment).
          [ -n "$MACOS_CERTIFICATE" ]     || missing="$missing MACOS_CERTIFICATE"
          [ -n "$MACOS_CERTIFICATE_PWD" ] || missing="$missing MACOS_CERTIFICATE_PWD"
          [ -n "$MACOS_SIGNING_IDENTITY" ] || missing="$missing MACOS_SIGNING_IDENTITY"
          [ -n "$APPLE_ID" ]              || missing="$missing APPLE_ID"
          [ -n "$APPLE_PASSWORD" ]        || missing="$missing APPLE_PASSWORD"
          [ -n "$APPLE_TEAM_ID" ]         || missing="$missing APPLE_TEAM_ID"
          # Updater key — doklin-specific, generated with `tauri signer generate`.
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]          || missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing signing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.tag }}   # the exact stamped commit

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The `doklin` command rides inside the app (bundle.macOS.files puts it
      # at Contents/Helpers/doklin), and Tauri's bundler signs only the app's
      # own binary — notarization refuses the bundle with any Mach-O in it not
      # signed with the Developer ID and the hardened runtime. So it is signed
      # here, in a keychain of its own that is gone before Tauri imports the
      # same certificate into one of its own: two keychains holding one
      # identity make codesign refuse it as ambiguous.
      - name: Build and sign the doklin CLI (macOS arm64)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          pnpm build:cli
          BIN="cli/target/aarch64-apple-darwin/release/doklin"
          archs="$(lipo -archs "$BIN")"
          [ "$archs" = "arm64" ] || { echo "::error::$BIN is not arm64-only: $archs"; exit 1; }
          [ "$("$BIN" --version)" = "doklin $VERSION" ] ||
            { echo "::error::$BIN reports '$("$BIN" --version)', not 'doklin $VERSION'"; exit 1; }
          KC="$RUNNER_TEMP/cli-signing.keychain-db"
          KC_PWD="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cli-signing.p12"
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 900 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          security import "$RUNNER_TEMP/cli-signing.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KC" >/dev/null
          codesign --force --options runtime --timestamp --keychain "$KC" --sign "$MACOS_SIGNING_IDENTITY" "$BIN"
          security delete-keychain "$KC"
          rm -f "$RUNNER_TEMP/cli-signing.p12"
          codesign --verify --strict "$BIN"

      # Tauri's bundler handles the whole signing story from env vars: imports
      # the cert into an ephemeral keychain, codesigns with hardened runtime,
      # notarizes the .app with notarytool, staples it, then signs the .dmg.
      # beforeBuildCommand is overridden to leave out `pnpm build:cli`: cargo
      # copies a fresh link of the CLI over the signed one even when nothing
      # changed, and the bundle would carry it unsigned.
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifact (.app.tar.gz -> .sig) against the pubkey
          # baked into tauri.conf.json. Required whenever createUpdaterArtifacts
          # is enabled — the build fails without it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-apple-darwin --config '{"build":{"beforeBuildCommand":"pnpm build"}}'

      # Assert the ticket is really attached — catches Tauri silently skipping
      # notarization (e.g. an env var it didn't recognize).
      - name: Verify signature + notarization
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Doklin.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          # arm64-only by design — fail if an x86_64 slice sneaks back in.
          for bin in "$APP"/Contents/MacOS/* "$APP"/Contents/Helpers/*; do
            archs="$(lipo -archs "$bin")"
            [ "$archs" = "arm64" ] || { echo "::error::$bin is not arm64-only: $archs"; exit 1; }
          done
          # The command inside it carries the Developer ID and the hardened
          # runtime, as signed above — not a fresh, unsigned build of it.
          CLI="$APP/Contents/Helpers/doklin"
          signed="$(codesign -dv --verbose=2 "$CLI" 2>&1)"
          echo "$signed" | grep -q '^Authority=Developer ID Application' ||
            { echo "::error::$CLI is not signed with the Developer ID"; echo "$signed"; exit 1; }
          echo "$signed" | grep -q 'flags=.*runtime' ||
            { echo "::error::$CLI lacks the hardened runtime"; echo "$signed"; exit 1; }

      # Notarize + staple the DMG itself too (Tauri only notarizes the .app),
      # so the downloaded .dmg passes Gatekeeper offline as well.
      - name: Stage, notarize and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Dedicated staging dir — must NOT be `dist/`, which is the Vite
          # frontend build output (pnpm build writes there); publishing dist/*
          # would sweep index.html and the web assets into the release.
          mkdir -p release-assets
          DMG="release-assets/Doklin-${VERSION}-macos-arm64.dmg"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "$DMG"
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$DMG"
          # Version-less alias (copied AFTER stapling) for a stable
          # releases/latest/download/ URL, plus a checksum manifest.
          cp "$DMG" release-assets/Doklin-macos-arm64.dmg
          (cd release-assets && shasum -a 256 *.dmg > SHA256SUMS)
          ls -la release-assets

      # Auto-updater artifacts: the signed .app.tar.gz that the updater plugin
      # downloads and swaps in, plus the latest.json manifest the app polls at
      # https://github.com/boat-builder/doklin/releases/latest/download/latest.json
      # (the endpoint in tauri.conf.json). The .tar.gz + .sig are produced by the
      # build (createUpdaterArtifacts + TAURI_SIGNING_PRIVATE_KEY); we publish
      # them as-is. Only darwin-aarch64 is listed — Intel installs of old
      # universal builds simply stop seeing updates.
      - name: Stage updater artifacts + latest.json
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          MACOS_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          TARBALL="$(ls "$MACOS_DIR"/*.app.tar.gz | head -n1)"
          SIG="$(cat "$MACOS_DIR"/*.app.tar.gz.sig)"
          cp "$TARBALL" release-assets/Doklin.app.tar.gz
          URL="https://github.com/boat-builder/doklin/releases/download/${TAG}/Doklin.app.tar.gz"
          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$SIG" \
            --arg url "$URL" \
            '{
              version: $v,
              notes: "Automatic update to Doklin v\($v). See the releases page for details.",
              pub_date: $d,
              platforms: {
                "darwin-aarch64": { signature: $sig, url: $url }
              }
            }' > release-assets/latest.json
          echo "=== latest.json ==="; cat release-assets/latest.json
          ls -la release-assets

      # The cloud worker, bundled to one file and attached to the release at
      #   https://github.com/boat-builder/doklin/releases/latest/download/doklin-cloud-worker.js
      # — the URL the app's setup prompt and the update script fetch, so nobody
      # clones or builds anything to deploy a domain.
      - name: Bundle cloud worker (release asset)
        run: node scripts/bundle-worker.mjs release-assets/doklin-cloud-worker.js

      # The update script, beside it at
      #   https://github.com/boat-builder/doklin/releases/latest/download/doklin-cloud-update.sh
      # — what the app's "Update the worker" card tells you (or your agent) to
      # curl and run. Verbatim: it carries its own compatibility date and the
      # bundle URL above, both pinned by verify-harness/cloudprompts.test.mjs.
      - name: Stage the cloud update script (release asset)
        run: |
          cp scripts/doklin-cloud-update.sh release-assets/doklin-cloud-update.sh
          chmod +x release-assets/doklin-cloud-update.sh

      # The `doklin` command (cli/): what an agent uses to
      # work with a workspace through its domain. Three binaries —
      #   doklin-linux-x64, doklin-linux-arm64   built by `build-cli`
      #   doklin-macos-arm64                     the signed one inside the app
      # — and the installer that picks one, at
      #   https://github.com/boat-builder/doklin/releases/latest/download/install-doklin.sh
      # which is the line the app's agent login card hands out. The installer
      # checks its download against SHA256SUMS, so the three are added to it.
      # On a Mac with the app it links to the copy inside it and downloads
      # nothing; doklin-macos-arm64 is for a Mac without the app.
      - name: Stage the macOS CLI (release asset)
        run: |
          set -euo pipefail
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Doklin.app/Contents/Helpers/doklin" \
            release-assets/doklin-macos-arm64

      - name: Fetch the Linux CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: doklin-linux-*
          path: release-assets
          merge-multiple: true

      - name: Stage the CLI installer and checksums
        run: |
          set -euo pipefail
          cp scripts/install-doklin.sh release-assets/install-doklin.sh
          chmod +x release-assets/install-doklin.sh
          (cd release-assets && shasum -a 256 doklin-linux-x64 doklin-linux-arm64 doklin-macos-arm64 >> SHA256SUMS)
          cat release-assets/SHA256SUMS
          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          files: release-assets/*
          make_latest: 'true'
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **macOS** Apple Silicon (M-series) `.dmg`, Developer ID signed and notarized — opens with no Gatekeeper prompt. Intel Macs are not supported.

            **`doklin` command** for agents (Linux x64 and arm64, macOS arm64): `curl -fsSL https://github.com/boat-builder/doklin/releases/latest/download/install-doklin.sh | sh`
