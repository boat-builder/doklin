name: site

# doklin.cc — the product page, and the page every link goes through
# (site/public/) — is whatever main has: a push to main that touches site/
# deploys it. It is an assets-only Worker (site/wrangler.jsonc) on the
# developer's own Cloudflare account. It has nothing to do with the worker on
# a workspace's domain, which ships in a release and is updated from the app.
#
# Nothing orders this with a release or with any domain's worker: a page
# that leans on a newer worker (the link page's Continue in browser needs
# /app on the link's domain) is live as soon as it is merged, whether or not
# that domain was updated. That is accepted.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   made from Cloudflare's "Edit Cloudflare Workers"
#                          policy, scoped to the one account and the
#                          doklin.cc zone
#   CLOUDFLARE_ACCOUNT_ID  the account doklin.cc is on
# With either missing the run fails, and says so: nothing is deployed
# half-way.
#
# workflow_dispatch deploys what main has again, by hand.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in the order of the pushes, so the last to run is
# what main has. A push that arrives while one waits takes its place.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy doklin.cc
    # Run by hand from another branch, it would put that branch on the live
    # site: only main is ever deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::doklin.cc was not deployed: this repository has no CLOUDFLARE_API_TOKEN secret, or no CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi
          npx --yes wrangler@4.131.1 deploy
